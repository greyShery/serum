experiment_dir: results/SERUM_sd21_gpu0_infoloss
dataset:
  name: /data2/fzx/SERUM/datasets/Stable-Diffusion-Prompts
  train_split: 40000
  batch_size: 32
  img_start: 0
  img_end: -1
  paths:
    generated_data_file: data_sd21_gen.pt
    augmented_data_file: data_sd21_aug.pt
    data_dir: ./datasets
diffusion:
  stable_diffusion_model_id: /data2/fzx/.cache/modelscope/models/AI-ModelScope--stable-diffusion-2-1-base/snapshots/master
  torch_dtype: float16
  device: cuda:0
  sampling:
    default_steps: 50
    cfg_scale: 7.5
shapes:
  image_size: 512
  latent_channels: 4
  latent_height: 64
  latent_width: 64
watermark:
  grid:
    noise_mix_alpha: 0.5
    clamp_std_multiplier: 4
    norm_win_size: 64
    norm_stride: 1
  buffer:
    size: 15000
  model_dir: models
  score_model_file: score_model.pt
  watermark_file: watermark.pt
training:
  train_batch_size: 16
  watermark_batch_size: 16
  aug_batch_size: 2
  aug_temp: 1.0
  epochs: 100
  full_eval_interval: -1
  checkpoint_dir: checkpoints
  random_seed: 42
  optimizer: Adam
  optimizer_score_model_args:
    lr: 0.001
    betas:
    - 0.9
    - 0.999
  scheduler: ReduceLROnPlateau
  scheduler_args:
    factor: 0.2
    patience: 2
  visualization:
    batch_size: 16
    log_interval: 500
    image_cnt: 4
  focal_gamma: 1.0
  pos_weight: 1.25
  neg_weight: 1.0
  # === 5 个原始创新（与 GPU 2/3 完全相同）===
  use_consistency: true
  consistency_weight: 0.1
  use_margin: true
  margin_weight: 0.05
  margin_value: 2.0
  use_alpha_reg: true
  alpha_reg_weight: 0.0001
  # === [v2 新增] GPU 0：Focal-strong + InfoNCE ===
  use_focal_strong: true
  focal_strong_weight: 0.5
  use_infoloss: true
  infoloss_weight: 0.1
  use_smooth_loss: false
  smooth_loss_weight: 1.0
evaluation:
  quick_samples: 20
  num_samples: 5000
  fid_num_samples: 10000
  batch_size: 16
  target_fpr: 0.01
  size:
  - 512
  - 512
  random_seed: 42
  original_path: gen_images/original
  clean_path: gen_images/clean
  watermarked_path: gen_images/watermarked
  positive_prompts_path: gen_images/positive_prompts.txt
  negative_prompts_path: gen_images/negative_prompts.txt
  augmented_path: gen_images/augmented
  eval_output_path: evaluation